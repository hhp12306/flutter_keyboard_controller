name: flutter_keyboard_controller15
description: >-
  三端键盘高度插件：Android / iOS 完整 FKC 跟帧；鸿蒙 5.0.3（API 15）专用 keyboardHeightChange 实现。
  Dart API 与 flutter_keyboard_controller 一致，公司工程可只依赖本包。
version: 1.0.4+ohos15
publish_to: none
homepage: https://github.com/congtuandevmobile/flutter_keyboard_controller

environment:
  sdk: ^3.3.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_keyboard_controller
        pluginClass: FlutterKeyboardControllerPlugin
      ios:
        pluginClass: FlutterKeyboardControllerPlugin
      ohos:
        pluginClass: FlutterKeyboardControllerPlugin
